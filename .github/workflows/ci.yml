name: ci

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: KB builds from the committed snapshot
        run: python kb/build_kb.py
      - name: Unit tests (guards, routing, retrieval, API request shape)
        run: python -m pytest -q
      - name: Safety gate on the no-LLM baseline
        run: python -m copilot eval --config mock --gate
      - name: Safety gate on the production config (only when an API key secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          python -m copilot smoke --config sonnet
          python -m copilot eval --config sonnet --gate
