name: ci

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: KB builds from the committed snapshot
        run: python kb/build_kb.py
      - name: Unit tests (guards, routing, retrieval, API request shape)
        run: python -m pytest -q
      - name: Safety gate on the no-LLM baseline
        run: python -m copilot eval --config mock --gate
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('requirements-rag.txt') }}
      - name: Multilingual retrieval gate (phase 2, local embeddings, no API key)
        run: |
          pip install -r requirements-rag.txt
          python -m copilot retrieval-eval --min-recall 0.9
      - name: Safety gate on Claude Sonnet (only when an Anthropic key secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          python -m copilot smoke --config sonnet
          python -m copilot eval --config sonnet --gate
      - name: Safety gate on GPT-5.5 (only when an OpenAI key secret is set)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python -m copilot smoke --config gpt-5.5
          python -m copilot eval --config gpt-5.5 --gate
